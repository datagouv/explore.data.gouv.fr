name: Build and push
run-name: Build and push ${{ github.ref_name }}
on:
  push:
    branches:
      - main
permissions:
  contents: read
env:
  CONTAINER_REGISTRY_SERVER: ${{ vars.CONTAINER_REGISTRY_SERVER }}
  CONTAINER_REGISTRY_NAMESPACE: ${{ vars.CONTAINER_REGISTRY_NAMESPACE }}
  IMAGE_NAME: explore
jobs:
  build:
    runs-on: ubuntu-latest
    # serialise builds so an older run can never push latest after a newer one
    concurrency:
      group: ${{ github.workflow }}
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Check build configuration
        env:
          VUE_APP_MATOMO_SITE_ID: ${{ vars.VUE_APP_MATOMO_SITE_ID }}
          VUE_APP_INCLUSION_TOKEN: ${{ secrets.VUE_APP_INCLUSION_TOKEN }}
        run: |
          # fail before the build, not after it, when the image could not be tagged or would ship incomplete
          for name in CONTAINER_REGISTRY_SERVER CONTAINER_REGISTRY_NAMESPACE VUE_APP_MATOMO_SITE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::repository variable $name is not set"
              exit 1
            fi
          done
          if [ -z "$VUE_APP_INCLUSION_TOKEN" ]; then
            echo "::warning::secret VUE_APP_INCLUSION_TOKEN is not set, the inclusion detail panel will not authenticate"
          fi

      - name: Set image version
        id: version
        run: echo "version=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.CONTAINER_REGISTRY_SERVER }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          build-args: |
            VUE_APP_MATOMO_SITE_ID=${{ vars.VUE_APP_MATOMO_SITE_ID }}
            VUE_APP_INCLUSION_TOKEN=${{ secrets.VUE_APP_INCLUSION_TOKEN }}
          tags: |
            ${{ vars.CONTAINER_REGISTRY_SERVER }}/${{ vars.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ vars.CONTAINER_REGISTRY_SERVER }}/${{ vars.CONTAINER_REGISTRY_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
