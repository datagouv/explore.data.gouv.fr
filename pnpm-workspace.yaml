strictPeerDependencies: false
nodeLinker: hoisted
minimumReleaseAge: 5760
shamefullyHoist: true
allowBuilds:
  '@parcel/watcher': false
  core-js: false
  core-js-pure: false
  maplibre-gl: false
overrides:
  webpack: '>=5.104.1 <5.110.0'
  serialize-javascript: '^7.1.3'
  qs: '^6.16.1'
  uuid: '^11.1.1'
  node-forge: '^1.4.3'
  # @vue/cli-service 5 depends on @vue/component-compiler-utils, which requires postcss 7.
  # Vue 2.7 builds never run that package: vue-loader 15 compiles with vue/compiler-sfc,
  # which uses postcss 8. Forcing postcss 8 everywhere is therefore safe.
  postcss: '^8.5.33'
