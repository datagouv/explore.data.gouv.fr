server {
    listen 80;

    # maplibre's tile worker is an ES module worker (.mjs): browsers require a JS MIME type.
    # A types block here replaces the inherited map, so re-include the defaults first.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    location / {
        root /app/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
