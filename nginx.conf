server {
    listen 80;

    # maplibre's tile worker is an ES module worker (.mjs): browsers require a JS MIME type.
    # A types block here replaces the inherited map, so re-include the defaults first.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    root /app/dist;

    # the maplibre worker files have no content hash in their name: make browsers
    # revalidate them so a maplibre upgrade never pairs a stale worker with a new bundle
    location ~ \.mjs$ {
        add_header Cache-Control "no-cache";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
